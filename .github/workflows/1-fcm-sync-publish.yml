name: Publish FCM background sync
on:
  push:
    branches: [feat/fcm-sync-20261008]
    paths: ['.github/workflows/*fcm-sync-publish.yml']
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GITHUB_REPO: test-owner/test-repo
      GITHUB_SYNC_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}
      - name: Apply the reviewed source overlay onto unchanged main
        run: |
          set -euo pipefail
          ls -la *fcm-overlay.zip
          cp "$(ls *fcm-overlay.zip | sort -V | tail -1)" /tmp/fcm-overlay.zip
          git fetch origin main
          test "$(git rev-parse origin/main)" = 3236a5930cd44b09801355870525f9e42a60971c
          git checkout -B main origin/main
          python3 - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('/tmp/fcm-overlay.zip') as z:
              names=z.namelist()
              assert names and all(not n.startswith('.github/') and not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
              z.extractall('.')
              print(len(names),'files applied')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r cloud/requirements.txt
      - run: python -m unittest discover -s cloud/tests -v
        env:
          PYTHONPATH: cloud
      - run: python -m unittest discover -s scripts/tests -v
      - run: for f in cloud/public/{app,settings,utilities,sections,practice,practice-data}.js; do node --check "$f"; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Refresh dependency locks and checksums for the new Firebase dependencies
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew resolveDependencyIntegrity :app:lintVitalAnalyzePlayRelease :app:lintVitalAnalyzeFdroidRelease :wear:lintVitalAnalyzeRelease :app:testPlayDebugUnitTest :app:testFdroidDebugUnitTest :wear:testDebugUnitTest --write-locks --write-verification-metadata sha256 --no-daemon --console=plain
          git diff --stat -- gradle/verification-metadata.xml app/gradle.lockfile wear/gradle.lockfile || true
          git diff --stat -- gradle/verification-metadata.xml app/gradle.lockfile wear/gradle.lockfile || true
          python3 - <<'PY'
          import re,subprocess,sys
          import xml.etree.ElementTree as ET
          def show(p):
              return subprocess.run(['git','show','HEAD:'+p],capture_output=True,text=True,check=True).stdout
          bad=[]
          # 1. verification-metadata: an artifact present before and after must keep the exact same sha256 set.
          def load(txt):
              root=ET.fromstring(re.sub(r'xmlns="[^"]+"','',txt,count=1))
              d={}
              for c in root.iter('component'):
                  for a in c.iter('artifact'):
                      d.setdefault((c.get('group'),c.get('name'),c.get('version'),a.get('name')),set()).update(s.get('value') for s in a.iter('sha256'))
              return d
          old=load(show('gradle/verification-metadata.xml')); new=load(open('gradle/verification-metadata.xml').read())
          changed=[k for k in old if k in new and old[k]!=new[k]]
          dropped=[k for k in old if k not in new]
          added=[k for k in new if k not in old]
          print('verification: artifacts old=%d new=%d dropped=%d added=%d hash-changed=%d'%(len(old),len(new),len(dropped),len(added),len(changed)))
          for k in changed[:20]: print('HASH CHANGED',k,old[k],new[k])
          if changed: bad.append('hash changed for existing artifact')
          # 2. lockfiles: a removed coordinate is fine only when the same group:artifact remains at another version.
          for p in ('app/gradle.lockfile','wear/gradle.lockfile'):
              o=[l.split('=')[0] for l in show(p).splitlines() if l and not l.startswith('#') and ':' in l]
              n=[l.split('=')[0] for l in open(p).read().splitlines() if l and not l.startswith('#') and ':' in l]
              ga=lambda c:c.rsplit(':',1)[0]
              nga={ga(c) for c in n}
              gone=[c for c in o if c not in n and ga(c) not in nga]
              print(p,'removed coords',len([c for c in o if c not in n]),'artifacts fully gone',len(gone))
              for c in gone[:40]: print('GONE',c)
              if gone: bad.append(p+': artifact dropped entirely')
          if bad:
              print('GUARD FAIL',bad); sys.exit(1)
          print('guard ok: only version upgrades and additions, no existing checksum changed')
          PY
      - name: Verify with checksum verification enforced (play and F-Droid, release graphs)
        run: ./gradlew verifyDependencyIntegrity :app:testPlayDebugUnitTest :app:testFdroidDebugUnitTest --no-daemon --console=plain
      - name: Show failing test messages
        if: failure()
        run: |
          for f in app/build/test-results/testPlayDebugUnitTest/*CloudSyncManagerTest.xml; do
            python3 - "$f" <<'PY'
          import sys,xml.etree.ElementTree as ET
          for c in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              for fl in c.findall('failure'):
                  print('FAILCASE', c.get('name'), '::', (fl.get('message') or '')[:800]); print((fl.text or '')[:1500])
          PY
          done
      - name: Commit verified source to main and start the signed release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          rm -f *fcm-overlay.zip
          sed -i 's/APP_VERSION = "1.15.47"/APP_VERSION = "1.16.0"/' cloud/server.py
          git add -A
          git commit -m 'feat: FCM background sync for cloud-to-phone alarm changes'
          git fetch origin main
          test "$(git rev-parse origin/main)" = 3236a5930cd44b09801355870525f9e42a60971c
          git push origin main
          gh workflow run android-release.yml --ref main -f version_name=1.16.0 -f version_code=155 -f 'release_notes=FCM background sync: the cloud server now wakes the phone the moment an alarm, setting or utility command changes, so web edits reach the phone in seconds without opening the app. Play build only; F-Droid keeps polling. Software tests passed; physical-device verification pending.'
