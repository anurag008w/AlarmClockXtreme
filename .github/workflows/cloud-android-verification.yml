name: Cloud and Android verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile github_sync.py usersync.py server.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew testFdroidDebug --no-daemon

  signed-release:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.ANDROID_KEYSTORE_BASE64 != '' &&
      secrets.ANDROID_KEYSTORE_PASSWORD != '' &&
      secrets.ANDROID_KEY_ALIAS != '' &&
      secrets.ANDROID_KEY_PASSWORD != ''
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release signing secret::Set GitHub Actions secret $name before building signed releases."
              exit 1
            fi
          done
      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/alarmclock-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/alarmclock-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build signed Play release
        run: ./gradlew assemblePlayRelease --no-daemon
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmclockxtreme-play-release
          path: app/build/outputs/apk/play/release/app-play-release.apk
          if-no-files-found: error
