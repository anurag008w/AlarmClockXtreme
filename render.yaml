services:
  - type: web
    name: alarmclockxtreme-cloud
    runtime: node
    rootDir: cloud
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: alarmclockxtreme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini

databases:
  - name: alarmclockxtreme-db
    databaseName: alarmclockxtreme
    user: alarmclock
    plan: free