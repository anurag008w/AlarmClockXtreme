name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.15.46)'
        required: false
        type: string
        default: ''
      version_code:
        description: 'Release version code (e.g. 148, leave blank to auto-increment)'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Release notes for CHANGELOG (optional)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply dispatch version override
        if: github.event_name == 'workflow_dispatch' && inputs.version_name != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py "${{ inputs.version_name }}" "${{ inputs.version_code }}" "${{ inputs.release_notes }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v${{ inputs.version_name }} [publish-release]"
          git tag -f "v${{ inputs.version_name }}"
          git push origin main
          git push -f origin "v${{ inputs.version_name }}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Require tag/version match
        if: github.ref_type == 'tag'
        shell: bash
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
            echo "::error title=Release tag/version mismatch::Tag $GITHUB_REF_NAME does not match app version $EXPECTED_TAG."
            exit 1
          fi

      - name: Require release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error title=Missing release signing secret::Set GitHub Actions secret $name before creating a signed APK."
              exit 1
            fi
          done

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/alarmclock-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/alarmclock-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed Play APK
        run: ./gradlew assemblePlayRelease --no-daemon

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClockXtreme-play-release
          path: app/build/outputs/apk/play/release/app-play-release.apk
          if-no-files-found: error
          retention-days: 1

      # Cloud/Android verification runs independently on push/PR.
      # A slow or failed verification job must not block publication of the
      # signed release artifact.
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.version_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/play/release/app-play-release.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" --clobber
          else
            # Real changelog for the in-app updater and the release page: the
            # bullets from WhatsNewNotes.kt, with GitHub's compare link appended.
            python3 scripts/release_notes.py "$VERSION_NAME" > /tmp/release-notes.md
            if [ -s /tmp/release-notes.md ]; then
              PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -n1 || true)
              if [ -n "$PREV" ]; then
                printf '\nFull changelog: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV" "$RELEASE_TAG" >> /tmp/release-notes.md
              fi
              NOTES_ARG="--notes-file /tmp/release-notes.md"
            else
              NOTES_ARG="--generate-notes"
            fi
            gh release create "$RELEASE_TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "AlarmClockXtreme v$VERSION_NAME" \
              $NOTES_ARG
          fi

          echo "Published GitHub Release: $RELEASE_TAG ($VERSION_CODE)"
