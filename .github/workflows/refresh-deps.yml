name: Refresh dependency metadata

# Regenerates gradle.lockfile and verification-metadata.xml after a dependency change and
# commits the result to the branch. Runs when this file changes.
on:
  push:
    branches:
      - "redesign/**"
    paths:
      - ".github/workflows/refresh-deps.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - name: Write locks and checksums
        run: ./gradlew resolveDependencyIntegrity :app:assemblePlayDebug :app:testPlayDebugUnitTest :app:testFdroidDebugUnitTest --no-daemon --write-locks --write-verification-metadata sha256
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/gradle.lockfile wear/gradle.lockfile gradle/verification-metadata.xml
          git diff --cached --stat
          git diff --cached --quiet || git commit -m "Refresh dependency locks and checksums"
          git push
