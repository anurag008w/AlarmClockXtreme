services:
  - type: web
    name: alarmclockxtreme-cloud
    runtime: python
    plan: free
    rootDir: cloud
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: GITHUB_REPO
        value: "anurag008w/smartrotator-data"
      - key: GITHUB_DATA_SUBDIR
        value: "alarmclockxtreme"
      - key: GITHUB_SYNC_ENABLED
        value: "true"
      - key: GITHUB_SYNC_INTERVAL
        value: "5"
      - key: GH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"