name: Cloud and Android verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check server.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m py_compile cloud/github_sync.py cloud/usersync.py cloud/server.py
      - run: chmod +x gradlew
      - run: ./gradlew testFdroidDebug --no-daemon